<style>

html,body{
margin:0;
padding:0;
background:transparent;
font-family:'Segoe UI',sans-serif;
overflow:hidden;
}

@keyframes pulseIDG{
0%{
transform:scale(1);
box-shadow:0 0 0 0 rgba(214,141,179,.55);
}
50%{
transform:scale(1.05);
box-shadow:0 0 0 18px rgba(214,141,179,0);
}
100%{
transform:scale(1);
box-shadow:0 0 0 0 rgba(214,141,179,0);
}
}

@keyframes shineIDG{
0%{left:-120%;}
100%{left:120%;}
}

.wrapper{
text-align:center;
padding:40px 20px;
}

.idg-btn{
display:inline-flex;
align-items:center;
gap:12px;
padding:18px 34px;
border-radius:999px;
background:linear-gradient(90deg,#d68db3,#ef9b71,#f2b45f);
color:white;
text-decoration:none;
font-size:18px;
font-weight:700;
position:relative;
overflow:hidden;
animation:pulseIDG 2s infinite;
}

.idg-btn::before{
content:'';
position:absolute;
top:0;
left:-120%;
width:80px;
height:100%;
background:rgba(255,255,255,.35);
transform:skewX(-25deg);
animation:shineIDG 3s linear infinite;
}

.idg-sub{
margin-top:14px;
font-size:14px;
color:#7a6a63;
}

</style>
</head>
